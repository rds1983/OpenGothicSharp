name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: |
            Directory.Build.props
            **/*.csproj

      - name: Restore
        run: dotnet restore OpenGothic.MonoGame.sln

      - name: Build
        run: dotnet build OpenGothic.MonoGame.sln -c Release --no-restore

      - name: Test
        run: dotnet test OpenGothic.MonoGame.sln -c Release --no-restore --no-build
